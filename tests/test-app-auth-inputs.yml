name: Test GitHub App Auth Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          org: ${{ github.repository_owner }}
          days: '1'
          appid: '000000'
          privatekey: 'fake-private-key-value'
          installationid: '000000'
      - name: Assert action was invoked with app auth inputs
        run: |
          # The action may fail when using invalid app credentials alongside a token,
          # but the important thing is that the inputs are accepted and the action runs.
          # We verify the step completed (either success or failure) without a setup error.
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with appid, privatekey, and installationid inputs"
