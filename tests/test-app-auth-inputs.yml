name: Test GitHub App Auth Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          appid: '123456'
          privatekey: 'fake-private-key'
          installationid: '789012'
          org: 'test-org'
          days: '1'
      - name: Assert action was invoked with app auth inputs
        run: |
          echo "Action completed (may have failed due to invalid credentials, which is expected)"
          echo "PASS: appid, privatekey, and installationid inputs were accepted"
