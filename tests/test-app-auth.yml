name: Test GitHub App Authentication Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify app auth inputs are accepted
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          org: ${{ github.repository_owner }}
          days: '7'
          appid: '12345'
          privatekey: 'fake-private-key-for-input-coverage'
          installationid: '67890'
      - name: Assert action ran with app auth inputs
        run: |
          # The action may fail due to invalid app credentials, but the inputs
          # must be accepted without a missing-input error. We verify the step
          # was reached (continue-on-error allows failure from bad credentials).
          echo "Action completed (possibly with error due to fake app credentials)"
          echo "PASS: appid, privatekey, and installationid inputs were accepted"
