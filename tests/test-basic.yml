name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          org: 'nicklegan'
          days: '7'
          sort: 'openedPullRequests'
          committer-name: 'github-actions'
          committer-email: 'github-actions@github.com'
        continue-on-error: true
      - name: Assert action ran without unexpected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to API rate limits or missing org access in test env,
          # but it should not fail due to misconfiguration of inputs.
          # We accept 'success' or 'failure' (API errors) but not 'skipped'.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
