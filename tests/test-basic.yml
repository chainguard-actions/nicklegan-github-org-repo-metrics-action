name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git for committer
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          org: ${{ github.repository_owner }}
          days: '7'
          sort: 'openedPullRequests'
          sort-order: 'desc'
          committer-name: 'github-actions'
          committer-email: 'github-actions@github.com'

      - name: Assert action ran without crashing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action may fail due to API limitations (e.g., owner is not an org,
          # or token lacks read:org scope), but it should not crash with an
          # unhandled exception. Both 'success' and 'failure' are acceptable;
          # only 'cancelled' or an empty outcome indicate a setup problem.
          if [ "$OUTCOME" = "cancelled" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: Action was cancelled or did not run"
            exit 1
          fi
          echo "PASS: Action ran (outcome=$OUTCOME)"
