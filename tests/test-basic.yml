name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with required inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          org: test-org
          days: '7'
          sort: 'openedPullRequests'
          sort-order: 'desc'
          stale: '14'
          old: '120'
          json: 'false'
          diff-report: 'false'
          committer-name: 'github-actions'
          committer-email: 'github-actions@github.com'

      - name: Assert action was invoked (may fail due to invalid token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail with an API error
          # It should NOT fail with a missing module or syntax error
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.action.outcome }})"
