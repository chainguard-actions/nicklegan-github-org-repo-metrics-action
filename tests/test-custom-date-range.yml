name: Test custom date range
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute date range
        id: dates
        run: |
          TODATE=$(date -u +%Y-%m-%d)
          FROMDATE=$(date -u -d "7 days ago" +%Y-%m-%d)
          echo "fromdate=$FROMDATE" >> $GITHUB_OUTPUT
          echo "todate=$TODATE" >> $GITHUB_OUTPUT
          echo "From: $FROMDATE  To: $TODATE"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: 'fake-token-for-act-testing'
          org: 'nicklegan'
          fromdate: ${{ steps.dates.outputs.fromdate }}
          todate: ${{ steps.dates.outputs.todate }}
          sort: 'openedPullRequests'
          sort-order: 'asc'
          stale: '14'
          old: '120'
          json: 'false'
          diff-report: 'false'
          committer-name: 'github-actions'
          committer-email: 'github-actions@github.com'

      - name: Assert action ran and failed gracefully with bad credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action makes real GitHub API calls which will fail with a fake token.
          # We verify the action ran and failed gracefully (not a crash/unhandled exception).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with bad credentials, got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed gracefully as expected with invalid token and custom date range"
