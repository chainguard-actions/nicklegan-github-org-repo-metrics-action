name: Test custom date range inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          org: 'nicklegan'
          fromdate: '2024-01-01'
          todate: '2024-01-07'
          sort: 'stars'
          committer-name: 'github-actions'
          committer-email: 'github-actions@github.com'
        continue-on-error: true
      - name: Assert action ran without unexpected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail due to API rate limits or missing org access in test env,
          # but it should not be skipped.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom date range (outcome=$OUTCOME)"
