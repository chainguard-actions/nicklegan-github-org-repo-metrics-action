name: Test custom parameters
on:
  workflow_dispatch:
jobs:
  test-custom-params:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify dist/index.js exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/dist/index.js" ]; then
            echo "FAIL: dist/index.js not found"
            exit 1
          fi
          echo "PASS: dist/index.js present"
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          org: ''
          days: '7'
          sort: 'stars'
          stale: '30'
          old: '90'
          committer-name: 'test-bot'
          committer-email: 'test-bot@example.com'
        continue-on-error: true
      - name: Assert action ran with custom params
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to API limitations in test environment,
          # but it should not fail due to invalid parameter handling.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with custom params (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
