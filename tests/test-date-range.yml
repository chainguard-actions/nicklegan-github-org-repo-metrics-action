name: Test date range inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with date range inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          org: test-org
          fromdate: '2024-01-01'
          todate: '2024-01-31'
          sort: 'openedPullRequests'
          sort-order: 'asc'
          stale: '14'
          old: '120'
          json: 'true'
          diff-report: 'true'
          committer-name: 'test-committer'
          committer-email: 'test@example.com'

      - name: Assert action was invoked with date range (may fail due to invalid token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail with an API error
          # It should NOT fail with a missing module or syntax error
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with date range (outcome: ${{ steps.action.outcome }})"
