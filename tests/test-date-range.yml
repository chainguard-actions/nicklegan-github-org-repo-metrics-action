name: Test date range inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: invalid-token-for-testing
          org: nonexistent-org-for-testing
          fromdate: '2024-01-01'
          todate: '2024-01-31'
          sort: openedPullRequests
          sort-order: asc
          stale: '7'
          old: '60'
          json: 'true'
          diff-report: 'true'
          committer-name: test-committer
          committer-email: test@example.com

      - name: Assert action ran (pass or fail gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' when using date range inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
