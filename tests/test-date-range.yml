name: Test date range inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          org: ''
          fromdate: '2024-01-01'
          todate: '2024-01-07'
          sort: 'forks'
          committer-name: 'test-bot'
          committer-email: 'test-bot@example.com'
        continue-on-error: true
      - name: Assert action completed with date range inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Accept success or failure (API/permission issues expected),
          # but not a runner-level error indicating a crash or missing module.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with date range (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
