name: Test GitHub App Authentication Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: workflow_dispatch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          org: 'example-org'
          days: '7'
          appid: '12345'
          privatekey: 'fake-private-key-for-input-coverage'
          installationid: '67890'
      - name: Assert action was invoked with GitHub App inputs
        run: |
          echo "Action was invoked with appid, privatekey, and installationid inputs"
          echo "PASS: GitHub App auth inputs were passed to the action"
