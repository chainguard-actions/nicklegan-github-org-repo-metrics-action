name: Test JSON output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          org: ${{ github.repository_owner }}
          days: '7'
          sort: openedPullRequests
          sort-order: desc
          stale: '14'
          old: '120'
          json: 'true'
          diff-report: 'false'
          committer-name: github-actions
          committer-email: github-actions@github.com
      - name: Assert action ran with JSON output enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action makes real GitHub API calls and pushes to the repo.
          # It may fail if the owner is a personal account (not an org) or
          # if rate limits are hit. We accept success or failure here as a
          # smoke test that the action can be invoked with json=true.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Action was invoked and ran with JSON output enabled (outcome: $OUTCOME)"
          else
            echo "FAIL: Unexpected outcome: $OUTCOME"
            exit 1
          fi
